name: verify

# 门禁目标：把「记得手工跑」变成「跑不过不能合」。
# 重点保护 scripts/check-isolation.mjs（61 张表多租户隔离静态扫描）——
# 这个项目把租户隔离当核心资产，此前它没有任何自动化保护。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 安装依赖（server）
        run: npm ci --prefix server || npm install --prefix server

      - name: 安装依赖（web）
        run: npm ci --prefix web || npm install --prefix web

      # 后端测试：79 个 node:test 文件
      - name: 后端测试
        run: npm run test

      - name: 类型检查
        run: npm run typecheck

      # 多租户隔离静态扫描：高危 > 0 即 exit 1
      - name: 多租户隔离扫描
        run: npm run check:isolation

      - name: 设计 token 落地率门禁
        run: npm run check:tokens

      - name: 前端界面契约（禁止文案与结构不变量）
        run: npm run check:ui-contract

      - name: ESLint（零 warning）
        run: npm --prefix web run lint:strict

      - name: Prettier 格式检查
        run: npm --prefix web run format:check

      - name: 构建
        run: npm run build
