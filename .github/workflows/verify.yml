name: verify

# 门禁目标：把「记得手工跑」变成「跑不过不能合」。
# 重点保护 scripts/check-isolation.mjs（61 张表多租户隔离静态扫描）——
# 这个项目把租户隔离当核心资产，此前它没有任何自动化保护。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 全新 Ubuntu runner 不预装 ffmpeg/ffprobe，也没有可嵌入的中文字体。
      # 文档与媒体测试必须在和真实交付一致的依赖下运行，不能因 runner 差异误报。
      - name: 安装媒体与中文文档测试依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg poppler-utils
          curl -fsSL --retry 3 \
            'https://raw.githubusercontent.com/notofonts/noto-cjk/165c01b46ea533872e002e0785ff17e44f6d97d8/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf' \
            -o "$RUNNER_TEMP/NotoSansCJKsc-Regular.otf"
          printf '%s  %s\n' \
            '2c76254f6fc379fddfce0a7e84fb5385bb135d3e399294f6eeb6680d0365b74b' \
            "$RUNNER_TEMP/NotoSansCJKsc-Regular.otf" | sha256sum -c -
          echo "PDF_FONT_PATH=$RUNNER_TEMP/NotoSansCJKsc-Regular.otf" >> "$GITHUB_ENV"
          echo "DOCX_FONT_PATH=$RUNNER_TEMP/NotoSansCJKsc-Regular.otf" >> "$GITHUB_ENV"

      - name: 安装依赖（server）
        run: npm ci --prefix server

      - name: 安装依赖（web）
        run: npm ci --prefix web

      # 使用独立数据库和模板 AI，运行当前全部 node:test 文件。
      - name: 后端测试
        run: npm run test

      # 常驻检查目录、导出器和模型注入的45/10/65源指纹；
      # 本地或私有 runner 可用 PAIHUO_CONTENT_REGISTRY_PATH 额外对照旧源全文 SHA。
      - name: 派活内容10岗源指纹门禁
        run: npm run check:paihuo-content-source

      - name: 类型检查
        run: npm run typecheck

      # 多租户隔离静态扫描：高危 > 0 即 exit 1
      - name: 多租户隔离扫描
        run: npm run check:isolation

      - name: 设计 token 落地率门禁
        run: npm run check:tokens

      - name: 前端界面契约（禁止文案与结构不变量）
        run: npm run check:ui-contract

      - name: ESLint（零 warning）
        run: npm --prefix web run lint:strict

      - name: Prettier 格式检查
        run: npm --prefix web run format:check

      - name: 构建
        run: npm run build
